<div
  class="max-h-0 overflow-hidden pt-1 pl-4 transition-all duration-500"
  [ngClass]="{
    hidden: !menuService.showSideBar,
    'max-h-screen': submenu.expanded
  }"
>
  <ul
    class="flex flex-col border-l border-dashed border-border pl-2 text-muted-foreground"
  >
    <li *ngFor="let sub of submenu.children">
      <div
        class="flex rounded text-muted-foreground hover:bg-card hover:text-foreground"
        (click)="toggleMenu(sub)"
      >
        <!-- Condition -->
        <ng-container
          [ngTemplateOutlet]="sub.children ? childMenu : parentMenu"
          [ngTemplateOutletContext]="{ sub: sub }"
        >
        </ng-container>

        <!-- Parent Menu -->
        <ng-template #parentMenu let-sub="sub">
          <a
            [routerLink]="sub.route"
            routerLinkActive="text-primary active3"
            [routerLinkActiveOptions]="{ exact: true }"
            class="inline-flex  w-full px-4 py-2 text-sm font-medium"
            ><img [src]="sub.icon" class="h-[20px] w-[20px] mr-2" />
            {{ sub.label }}
          </a>
        </ng-template>

        <!-- Child Menu -->
        <ng-template #childMenu let-sub="sub">
          <a
            class="inline-flex w-full cursor-pointer px-4 py-2 text-sm font-medium"
          >
          <img [src]="sub.icon" class="h-[20px] w-[20px] mr-2" />
            {{ sub.label }}
          </a>

          <button *ngIf="sub.children"
            [ngClass]="{
              hidden: !menuService.showSideBar,
              'rotate-90': sub.expanded
            }"
            class="flex items-center p-1 text-muted-foreground transition-all duration-500"
          >
            <img
              src="../../../../../assets/icons/heroicons/solid/chevron-right.svg"
              class="h-6 w-6"
              alt=""
            />
          </button>
        </ng-template>
      </div>
      <!-- Submenu items -->
      <app-sidebar-submenu [submenu]="sub"></app-sidebar-submenu>
    </li>
  </ul>
</div>
